name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: pytest
        run: pytest -v --cov=. --cov-report=term-missing
        env:
          GROQ_API_KEY: ci-test-key
          RAZORPAY_KEY_ID: ci-test-key-id
          RAZORPAY_KEY_SECRET: ci-test-key-secret

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (format check)
        run: npm run format:check

      - name: TypeScript (type check)
        # next typegen generates the ambient route types (e.g. LayoutProps)
        # that Next.js normally only emits as a side effect of `next build`/
        # `next dev` — without it, a standalone tsc run fails on those names.
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Vitest
        run: npm run test -- --run

      - name: npm audit (dependency vulnerabilities)
        run: npm audit --audit-level=high
        continue-on-error: true
